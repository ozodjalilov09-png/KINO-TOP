<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kino Top</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0d12;
    --bg-elev:#17151d;
    --bg-elev-2:#1e1b25;
    --accent:#e8a33d;
    --accent-soft:#f0c37a;
    --velvet:#c1443d;
    --text:#f3efe6;
    --text-dim:#9a93a6;
    --stub-notch: var(--bg);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, #241f2b 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:calc(24px + var(--safe-bottom));
    overflow-x:hidden;
  }

  /* Film-strip perforation band */
  .filmstrip{
    height:14px;
    width:100%;
    background-image:
      repeating-linear-gradient(90deg, var(--bg-elev-2) 0 8px, transparent 8px 18px);
    background-color:#000;
    position:relative;
  }
  .filmstrip::before, .filmstrip::after{
    content:"";
    position:absolute;
    top:3px;
    height:8px;
    width:100%;
    background-image: repeating-linear-gradient(90deg, var(--bg) 0 5px, transparent 5px 15px);
  }

  header.hero{
    padding:22px 20px 18px;
    padding-top:calc(22px + var(--safe-top));
    position:relative;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    margin:0 0 4px;
  }
  h1.marquee{
    font-family:'Bebas Neue',sans-serif;
    font-size:60px;
    letter-spacing:.04em;
    margin:0;
    line-height:.9;
    background:linear-gradient(180deg, var(--accent-soft), var(--accent) 60%, #b9781f);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 2px 24px rgba(232,163,61,.18);
  }
  .sub{
    color:var(--text-dim);
    font-size:13.5px;
    margin-top:6px;
    max-width:32ch;
  }

  .search-wrap{
    margin:18px 20px 6px;
    position:relative;
  }
  .search-wrap input{
    width:100%;
    background:var(--bg-elev);
    border:1px solid #2a2632;
    color:var(--text);
    padding:13px 16px 13px 42px;
    border-radius:14px;
    font-size:15px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s ease;
  }
  .search-wrap input:focus{ border-color:var(--accent); }
  .search-wrap input::placeholder{ color:var(--text-dim); }
  .search-icon{
    position:absolute;
    left:15px; top:50%; transform:translateY(-50%);
    width:16px; height:16px;
    color:var(--text-dim);
  }

  .chips{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:14px 20px 4px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    padding:8px 15px;
    border-radius:999px;
    background:var(--bg-elev);
    border:1px solid #2a2632;
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .chip.active{
    background:var(--accent);
    color:#1a1305;
    border-color:var(--accent);
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    padding:16px 20px 10px;
  }
  @media (min-width:640px){
    .grid{ grid-template-columns:repeat(3,1fr); }
  }
  @media (min-width:900px){
    .grid{ grid-template-columns:repeat(4,1fr); gap:18px; }
    header.hero, .search-wrap, .chips, .grid, .empty{
      max-width:1100px;
      margin-left:auto;
      margin-right:auto;
    }
    body{ max-width:1180px; margin:0 auto; }
  }
  @media (min-width:1300px){
    .grid{ grid-template-columns:repeat(5,1fr); }
  }

  /* Ticket stub card — the signature element */
  .ticket{
    position:relative;
    background:var(--bg-elev);
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    border:1px solid #2a2632;
    transition:transform .12s ease, border-color .12s ease;
  }
  .ticket:active{ transform:scale(.97); }
  .poster{
    width:100%;
    aspect-ratio:2/3;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    background:linear-gradient(160deg,#242030,#171520);
  }
  .poster::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(120px 120px at 50% 38%, rgba(255,255,255,.10), transparent 70%);
  }
  .poster-icon{
    font-size:52px;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));
    position:relative;
    z-index:1;
  }
  .poster-title{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:16px 10px 10px;
    font-family:'Bebas Neue',sans-serif;
    font-size:15px;
    letter-spacing:.02em;
    line-height:1.05;
    text-align:center;
    color:rgba(255,255,255,.85);
    background:linear-gradient(0deg, rgba(0,0,0,.55), transparent);
    z-index:1;
  }
  .poster-logo{
    position:absolute;
    top:8px; left:8px;
    display:flex;
    align-items:center;
    gap:4px;
    padding:4px 8px 4px 6px;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(3px);
    border:1px solid rgba(232,163,61,.4);
    border-radius:7px;
    font-family:'Bebas Neue',sans-serif;
    font-size:13px;
    letter-spacing:.08em;
    color:var(--accent-soft);
    z-index:1;
  }
  .poster-logo::before{
    content:"🎬";
    font-size:12px;
  }
  .sheet-poster .poster-icon{ font-size:32px; }
  .sheet-poster .poster-title{ font-size:12px; padding:12px 6px 8px; }
  .sheet-poster .poster-logo{ font-size:10px; padding:3px 6px 3px 5px; top:6px; left:6px; }
  .sheet-poster .poster-logo::before{ font-size:9px; }
  .rating-badge{
    position:absolute;
    top:8px; right:8px;
    background:rgba(14,13,18,.78);
    backdrop-filter:blur(4px);
    color:var(--accent-soft);
    font-size:11.5px;
    font-weight:800;
    padding:3px 8px;
    border-radius:8px;
    display:flex;
    align-items:center;
    gap:3px;
    border:1px solid rgba(232,163,61,.35);
  }
  .fav-mark{
    position:absolute;
    top:8px; left:8px;
    font-size:15px;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));
    z-index:2;
  }
  .rating-badge.upcoming{
    color:var(--velvet);
    border-color:rgba(193,68,61,.45);
    letter-spacing:.03em;
  }
  .stub-divider{
    position:relative;
    height:1px;
    border-top:1.5px dashed #34303f;
    margin:0 2px;
  }
  .stub-divider::before, .stub-divider::after{
    content:"";
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:16px; height:16px;
    background:var(--bg);
    border-radius:50%;
  }
  .stub-divider::before{ left:-10px; }
  .stub-divider::after{ right:-10px; }

  .ticket-body{ padding:10px 12px 12px; }
  .ticket-title{
    font-size:14px;
    font-weight:700;
    line-height:1.25;
    margin:0 0 4px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .ticket-meta{
    font-size:11.5px;
    color:var(--text-dim);
    display:flex;
    gap:6px;
    align-items:center;
  }
  .dot{ width:3px; height:3px; border-radius:50%; background:var(--text-dim); }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--text-dim);
    font-size:14px;
  }

  /* Detail sheet */
  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(5,4,7,.6);
    backdrop-filter:blur(2px);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
    z-index:40;
  }
  .sheet-backdrop.open{ opacity:1; pointer-events:auto; }

  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    max-height:88vh;
    background:var(--bg-elev);
    border-radius:22px 22px 0 0;
    transform:translateY(102%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
    z-index:41;
    overflow-y:auto;
    padding-bottom:calc(24px + var(--safe-bottom));
  }
  .sheet.open{ transform:translateY(0); }
  .sheet-handle{
    width:36px; height:4px;
    background:#3a3546;
    border-radius:99px;
    margin:10px auto 0;
  }
  .sheet-hero{
    position:relative;
    display:flex;
    gap:14px;
    padding:18px 20px 14px;
  }
  .sheet-poster{
    width:104px; aspect-ratio:2/3;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .sheet-info{ padding-top:2px; }
  .sheet-title{
    font-family:'Bebas Neue',sans-serif;
    font-size:26px;
    letter-spacing:.02em;
    line-height:1;
    margin:0 0 8px;
    color:var(--text);
  }
  .sheet-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .tag{
    font-size:11px; font-weight:700;
    padding:4px 9px;
    border-radius:7px;
    background:var(--bg-elev-2);
    color:var(--text-dim);
    border:1px solid #2a2632;
  }
  .sheet-rating{
    display:flex; align-items:center; gap:5px;
    color:var(--accent-soft); font-weight:800; font-size:14px;
  }
  .sheet-divider{ position:relative; height:1px; border-top:1.5px dashed #34303f; margin:2px 0 16px; }
  .sheet-divider::before, .sheet-divider::after{
    content:""; position:absolute; top:50%; transform:translateY(-50%);
    width:20px; height:20px; background:var(--bg); border-radius:50%;
  }
  .sheet-divider::before{ left:-10px; }
  .sheet-divider::after{ right:-10px; }
  .sheet-desc{
    padding:0 20px;
    font-size:14px;
    line-height:1.6;
    color:#d8d3e0;
  }

  /* Season / episode picker for series & anime */
  .episodes-block{
    padding:16px 20px 0;
  }
  .episodes-label{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:700;
    margin:0 0 8px;
  }
  .season-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:10px;
    scrollbar-width:none;
  }
  .season-tabs::-webkit-scrollbar{ display:none; }
  .season-tab{
    flex:0 0 auto;
    padding:7px 14px;
    border-radius:999px;
    background:var(--bg-elev-2);
    border:1px solid #2a2632;
    color:var(--text-dim);
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .season-tab.active{
    background:var(--accent);
    color:#1a1305;
    border-color:var(--accent);
  }
  .episode-grid{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:8px;
  }
  @media (min-width:900px){
    .episode-grid{ grid-template-columns:repeat(10, 1fr); }
  }
  .episode-btn{
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg-elev-2);
    border:1px solid #2a2632;
    border-radius:9px;
    color:var(--text);
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    transition:all .12s ease;
  }
  .episode-btn:active{ transform:scale(.93); }
  .episode-btn.active{
    background:var(--accent);
    color:#1a1305;
    border-color:var(--accent);
  }
  .sheet-actions{
    padding:18px 20px 4px;
    display:flex;
    gap:10px;
  }
  .teaser-row{
    padding:14px 20px 0;
  }
  .btn-teaser{
    width:100%;
    background:transparent;
    border:1.5px solid var(--accent);
    color:var(--accent-soft);
    padding:13px;
    border-radius:14px;
    font-family:inherit;
    font-weight:800;
    font-size:14.5px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .btn-teaser:active{
    background:rgba(232,163,61,.12);
  }

  .btn-watch{
    flex:1;
    background:linear-gradient(135deg, var(--accent-soft), var(--accent));
    color:#1a1305;
    border:none;
    padding:14px;
    border-radius:14px;
    font-weight:800;
    font-size:15px;
    font-family:inherit;
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
  }
  .btn-fav{
    background:var(--bg-elev-2);
    color:var(--accent-soft);
    border:1px solid #2a2632;
    padding:14px 16px;
    border-radius:14px;
    font-size:18px;
    line-height:1;
    cursor:pointer;
  }
  .btn-fav.active{
    background:rgba(232,163,61,.15);
    border-color:var(--accent);
  }
  .btn-close{
    background:var(--bg-elev-2);
    color:var(--text-dim);
    border:1px solid #2a2632;
    padding:14px 18px;
    border-radius:14px;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
  }

  /* Video player overlay */
  .player-backdrop{
    position:fixed; inset:0;
    background:#000;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
    z-index:60;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .player-backdrop.open{ opacity:1; pointer-events:auto; }
  .player-inner{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .player-inner video{
    width:100%;
    max-height:100%;
    outline:none;
    background:#000;
  }
  .player-close{
    position:absolute;
    top:calc(14px + var(--safe-top));
    right:14px;
    width:38px; height:38px;
    border-radius:50%;
    background:rgba(20,18,26,.7);
    backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.15);
    color:var(--text);
    font-size:18px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:2;
  }
  .player-title{
    position:absolute;
    top:calc(14px + var(--safe-top));
    left:16px;
    right:64px;
    color:var(--text);
    font-family:'Bebas Neue',sans-serif;
    font-size:18px;
    letter-spacing:.02em;
    text-shadow:0 2px 8px rgba(0,0,0,.6);
    z-index:2;
    pointer-events:none;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:calc(24px + var(--safe-bottom, 0px));
    transform:translateX(-50%) translateY(20px);
    background:rgba(24,20,30,.96);
    border:1px solid rgba(232,163,61,.35);
    color:var(--text);
    padding:13px 18px;
    border-radius:14px;
    font-size:13.5px;
    font-weight:600;
    max-width:88%;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,.4);
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    z-index:80;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .ad-backdrop{
    position:fixed; inset:0;
    background:#000;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
    z-index:70;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .ad-backdrop.open{ opacity:1; pointer-events:auto; }
  .ad-media{
    max-width:100%;
    max-height:78%;
    object-fit:contain;
  }
  .ad-label{
    position:absolute;
    top:calc(14px + var(--safe-top));
    left:16px;
    color:var(--text-dim);
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    font-weight:700;
    background:rgba(20,18,26,.7);
    padding:5px 10px;
    border-radius:999px;
  }
  .ad-skip{
    position:absolute;
    bottom:calc(28px + var(--safe-bottom, 0px));
    right:20px;
    padding:11px 20px;
    border-radius:999px;
    background:rgba(20,18,26,.85);
    border:1px solid rgba(255,255,255,.18);
    color:var(--text);
    font-family:inherit;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .ad-skip:disabled{
    color:var(--text-dim);
    cursor:default;
  }
  .ad-cta{
    margin-top:16px;
    color:var(--accent-soft);
    font-size:13px;
    font-weight:700;
    text-decoration:none;
    border:1px solid var(--accent);
    padding:9px 18px;
    border-radius:999px;
  }
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="filmstrip"></div>

<header class="hero">
  <p class="eyebrow">Bugungi tanlov</p>
  <h1 class="marquee">KINO TOP</h1>
  <p class="sub">Eng yaxshi baholangan filmlar — bittasini tanlang va tomosha qilishni boshlang.</p>
</header>

<div class="search-wrap">
  <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  <input id="search" type="text" placeholder="Film qidirish...">
</div>

<div class="chips" id="chips"></div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none;">Hech narsa topilmadi 🎬</div>

<div class="filmstrip"></div>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-hero">
    <div class="sheet-poster" id="sheet-poster"></div>
    <div class="sheet-info">
      <h2 class="sheet-title" id="sheet-title"></h2>
      <div class="sheet-tags" id="sheet-tags"></div>
      <div class="sheet-rating" id="sheet-rating"></div>
    </div>
  </div>
  <div class="sheet-divider"></div>
  <p class="sheet-desc" id="sheet-desc"></p>
  <div class="episodes-block" id="episodes-block" style="display:none;">
    <p class="episodes-label">Fasl va qismlar</p>
    <div class="season-tabs" id="season-tabs"></div>
    <div class="episode-grid" id="episode-grid"></div>
  </div>
  <div class="teaser-row" id="teaser-row" style="display:none;">
    <button class="btn-teaser" id="btn-teaser">🎬 Tizerni ko'rish</button>
  </div>
  <div class="sheet-actions">
    <button class="btn-watch" id="btn-watch">▶ Tomosha qilish</button>
    <button class="btn-fav" id="btn-fav" aria-label="Sevimlilarga qo'shish">☆</button>
    <button class="btn-close" id="btn-close">Yopish</button>
  </div>
</div>

<div class="ad-backdrop" id="ad-backdrop">
  <span class="ad-label">Reklama</span>
  <img class="ad-media" id="ad-image" src="" alt="Reklama" style="display:none;">
  <video class="ad-media" id="ad-video" playsinline style="display:none;"></video>
  <a class="ad-cta" id="ad-cta" href="#" target="_blank" style="display:none;">Batafsil</a>
  <button class="ad-skip" id="ad-skip">O'tkazib yuborish · <span id="ad-timer">5</span></button>
</div>

<div class="player-backdrop" id="player-backdrop">
  <div class="player-inner">
    <div class="player-title" id="player-title"></div>
    <button class="player-close" id="player-close" aria-label="Yopish">✕</button>
    <video id="player-video" controls playsinline></video>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;

let toastTimer = null;
function showMsg(text){
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  tg?.HapticFeedback?.notificationOccurred?.('warning');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor?.('#0e0d12');

function fallbackPoster(el, m){
  const theme = GENRE_THEME[m.genre] || { icon:"🎬", grad:"linear-gradient(160deg,#242030,#171520)" };
  const icon = m.icon || theme.icon;
  el.style.background = theme.grad;
  el.innerHTML = `
    <span class="poster-logo">KINO TOP</span>
    <span class="poster-icon">${icon}</span>
    <div class="poster-title">${m.title}</div>
  `;
}

function applyPoster(el, m){
  if (m.poster) {
    el.style.background = '#0e0d12';
    el.innerHTML = `
      <img src="${m.poster}" alt="${m.title}" loading="lazy"
           style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;">
      <span class="poster-logo" style="z-index:2;">KINO TOP</span>
    `;
    // agar rasm topilmasa, ikonkali dizaynga qaytish
    const img = el.querySelector('img');
    img.addEventListener('error', () => fallbackPoster(el, m), { once:true });
    return;
  }
  fallbackPoster(el, m);
}

const GENRES = ["Barchasi", "Drama", "Jangari", "Komediya", "Fantastika", "Triller", "Anime", "Sarguzasht", "Serial", "Sevimlilar"];
let activeGenre = "Barchasi";
let query = "";

// --- Sevimlilar: Telegram CloudStorage bo'lsa shu yerda, aks holda xotirada saqlanadi ---
let favorites = new Set();
function loadFavorites(cb){
  let done = false;
  const finish = () => { if (!done) { done = true; cb?.(); } };
  if (tg?.CloudStorage?.getItem) {
    try {
      tg.CloudStorage.getItem('favorites', (err, value) => {
        if (!err && value) {
          try { favorites = new Set(JSON.parse(value)); } catch(e) {}
        }
        finish();
      });
    } catch(e) { finish(); }
    // Telegramdan tashqarida CloudStorage javob qaytarmasligi mumkin — shuning uchun sug'urta
    setTimeout(finish, 700);
  } else {
    finish();
  }
}
function saveFavorites(){
  if (tg?.CloudStorage) {
    tg.CloudStorage.setItem('favorites', JSON.stringify([...favorites]));
  }
}
function toggleFavorite(id){
  if (favorites.has(id)) favorites.delete(id); else favorites.add(id);
  saveFavorites();
  tg?.HapticFeedback?.impactOccurred?.('light');
}

function render(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';
  const filtered = MOVIES.filter(m =>
    (activeGenre === "Barchasi" || (activeGenre === "Sevimlilar" ? favorites.has(m.id) : m.genre === activeGenre)) &&
    (query === "" || m.title.toLowerCase().includes(query))
  );
  empty.style.display = filtered.length ? 'none' : 'block';
  if (!filtered.length) {
    empty.textContent = activeGenre === "Sevimlilar" ? "Hali sevimlilar yo'q ⭐" : "Hech narsa topilmadi 🎬";
  }
  filtered.forEach(m => {
    const card = document.createElement('div');
    card.className = 'ticket';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', m.title);
    const badge = m.upcoming
      ? `<div class="rating-badge upcoming">🔜 TEZ KUNDA</div>`
      : `<div class="rating-badge">★ ${m.rating}</div>`;
    const favIcon = favorites.has(m.id) ? '⭐' : '';
    card.innerHTML = `
      <div style="position:relative;">
        <div class="poster"></div>
        ${favIcon ? `<div class="fav-mark">${favIcon}</div>` : ''}
        ${badge}
      </div>
      <div class="stub-divider"></div>
      <div class="ticket-body">
        <p class="ticket-title">${m.title}</p>
        <div class="ticket-meta"><span>${m.year}</span><span class="dot"></span><span>${m.genre}</span></div>
      </div>
    `;
    applyPoster(card.querySelector('.poster'), m);
    card.onclick = () => { tg?.HapticFeedback?.impactOccurred?.('light'); openSheet(m); };
    card.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(m); } };
    grid.appendChild(card);
  });
}

const sheet = document.getElementById('sheet');

function openSheet(m){
  applyPoster(document.getElementById('sheet-poster'), m);
  document.getElementById('sheet-title').textContent = m.title;
  document.getElementById('sheet-tags').innerHTML =
    `<span class="tag">${m.year}</span><span class="tag">${m.genre}</span><span class="tag">${m.duration}</span>`;
  const ratingEl = document.getElementById('sheet-rating');
  const watchBtn = document.getElementById('btn-watch');
  if (m.upcoming) {
    ratingEl.innerHTML = `🔜 Chiqish sanasi: ${m.releaseDate}`;
    watchBtn.textContent = "🔔 Chiqqanda xabar bering";
  } else {
    ratingEl.innerHTML = `★ ${m.rating} / 10`;
    watchBtn.textContent = m.seasons ? "▶ 1-qismni tomosha qilish" : "▶ Tomosha qilish";
  }
  document.getElementById('sheet-desc').textContent = m.desc;

  const favBtn = document.getElementById('btn-fav');
  const syncFavBtn = () => {
    const isFav = favorites.has(m.id);
    favBtn.textContent = isFav ? '★' : '☆';
    favBtn.classList.toggle('active', isFav);
    favBtn.setAttribute('aria-label', isFav ? "Sevimlilardan olib tashlash" : "Sevimlilarga qo'shish");
  };
  syncFavBtn();
  favBtn.onclick = () => {
    toggleFavorite(m.id);
    syncFavBtn();
    if (activeGenre === "Sevimlilar") render();
  };

  const episodesBlock = document.getElementById('episodes-block');
  let selectedSeason = 0, selectedEpisode = 1;

  function updateWatchLabel(){
    if (m.seasons && m.seasons.length) {
      watchBtn.textContent = `▶ ${selectedEpisode}-qismni tomosha qilish`;
    }
  }

  function playEpisode(seasonIdx, epNum){
    selectedSeason = seasonIdx;
    selectedEpisode = epNum;
    const season = m.seasons[seasonIdx];
    document.querySelectorAll('#season-tabs .season-tab').forEach((el,i) => el.classList.toggle('active', i === seasonIdx));
    document.querySelectorAll('#episode-grid .episode-btn').forEach(el => el.classList.toggle('active', Number(el.textContent) === epNum));
    updateWatchLabel();
    const videoUrl = episodeVideo(season, epNum);
    if (videoUrl) {
      closeSheet();
      openPlayer({ ...m, video: videoUrl }, `${m.title} — ${season.label}, ${epNum}-qism`);
    } else {
      const msg = `"${m.title}" ${season.label}, ${epNum}-qism tez orada qo'shiladi 🎬`;
      showMsg(msg);
    }
  }

  function renderSeasonTabs(){
    const tabsEl = document.getElementById('season-tabs');
    tabsEl.innerHTML = '';
    m.seasons.forEach((s, i) => {
      const tab = document.createElement('div');
      tab.className = 'season-tab' + (i === selectedSeason ? ' active' : '');
      tab.textContent = s.label;
      tab.onclick = () => {
        selectedSeason = i;
        selectedEpisode = 1;
        tg?.HapticFeedback?.selectionChanged?.();
        renderSeasonTabs();
        renderEpisodeGrid();
        updateWatchLabel();
      };
      tabsEl.appendChild(tab);
    });
  }

  function episodeCount(season){
    return Array.isArray(season.episodes) ? season.episodes.length : season.episodes;
  }
  function episodeVideo(season, epNum){
    if (Array.isArray(season.episodes)) {
      const ep = season.episodes.find(e => e.num === epNum);
      return ep?.video || '';
    }
    return m.video || '';
  }

  function renderEpisodeGrid(){
    const gridEl = document.getElementById('episode-grid');
    gridEl.innerHTML = '';
    const season = m.seasons[selectedSeason];
    const count = episodeCount(season);
    for (let ep = 1; ep <= count; ep++) {
      const btn = document.createElement('div');
      btn.className = 'episode-btn' + (ep === selectedEpisode ? ' active' : '');
      btn.textContent = ep;
      btn.onclick = () => { tg?.HapticFeedback?.impactOccurred?.('light'); playEpisode(selectedSeason, ep); };
      gridEl.appendChild(btn);
    }
  }

  if (m.seasons && m.seasons.length) {
    episodesBlock.style.display = 'block';
    renderSeasonTabs();
    renderEpisodeGrid();
  } else {
    episodesBlock.style.display = 'none';
  }

  const teaserRow = document.getElementById('teaser-row');
  const teaserBtn = document.getElementById('btn-teaser');
  if (m.teaser) {
    teaserRow.style.display = 'block';
    teaserBtn.onclick = () => {
      closeSheet();
      openPlayer({ ...m, video: m.teaser }, `${m.title} — Tizer`);
    };
  } else {
    teaserRow.style.display = 'none';
    teaserBtn.onclick = null;
  }

  watchBtn.onclick = () => {
    if (m.seasons && m.seasons.length) {
      playEpisode(selectedSeason, selectedEpisode);
      return;
    }
    if (m.upcoming) {
      const msg = `"${m.title}" ${m.releaseDate}'da chiqadi — chiqqanda sizga xabar beramiz 🔔`;
      showMsg(msg);
      return;
    }
    if (m.video) {
      closeSheet();
      openPlayer(m);
      return;
    }
    showMsg(`"${m.title}" filmi tez orada qo'shiladi 🎬`);
  };
  sheet.classList.add('open');
  backdrop.classList.add('open');
  tg?.BackButton?.show();
}

function closeSheet(){
  sheet.classList.remove('open');
  backdrop.classList.remove('open');
  tg?.BackButton?.hide();
}

// blockId: partner.adsgram.ai kabinetidan olingan Ad unit ID (raqamlar).
// "your-block-id" ni haqiqiy ID'ingizga almashtiring.
const ADSGRAM_BLOCK_ID = "int-41031";

// Agar Adsgram ishlamasa (blockId qo'yilmagan, reklama topilmasa va h.k.),
// shu oddiy banner ko'rsatiladi. Xohlamasangiz enabled: false qiling.
const AD_CONFIG = {
  enabled: true,
  type: "image",
  src: "image/reklama.jpg",
  link: "",
  skipAfter: 5,
};

let adsgramController = null;
try {
  if (window.Adsgram && ADSGRAM_BLOCK_ID !== "your-block-id") {
    adsgramController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
  }
} catch (e) {
  console.warn("Adsgram init failed:", e);
  adsgramController = null;
}

const adBackdrop = document.getElementById('ad-backdrop');
const adImage = document.getElementById('ad-image');
const adVideo = document.getElementById('ad-video');
const adCta = document.getElementById('ad-cta');
const adSkip = document.getElementById('ad-skip');
let adCountdownInterval = null;

function showAd(onDone){
  // 1) Avval Adsgram orqali urinib ko'ramiz (haqiqiy pul keltiradigan reklama).
  if (adsgramController) {
    try {
      adsgramController.show()
        .then(() => onDone())   // reklama to'liq ko'rildi
        .catch(() => onDone()); // xato/o'tkazib yuborildi — baribir videoni ochamiz
    } catch (e) {
      console.warn("Adsgram show failed:", e);
      onDone(); // kutilmagan xato bo'lsa ham video ochilaveradi
    }
    return;
  }
  // 2) Adsgram sozlanmagan bo'lsa — o'zimizning oddiy bannerimiz.
  showFallbackAd(onDone);
}

function showFallbackAd(onDone){
  if (!AD_CONFIG.enabled || !AD_CONFIG.src) { onDone(); return; }

  adImage.style.display = 'none';
  adVideo.style.display = 'none';
  adVideo.pause();
  adCta.style.display = AD_CONFIG.link ? 'inline-block' : 'none';
  if (AD_CONFIG.link) adCta.href = AD_CONFIG.link;

  if (AD_CONFIG.type === 'video') {
    adVideo.src = AD_CONFIG.src;
    adVideo.style.display = 'block';
    adVideo.play().catch(() => {});
  } else {
    adImage.src = AD_CONFIG.src;
    adImage.style.display = 'block';
  }

  adBackdrop.classList.add('open');
  let secondsLeft = AD_CONFIG.skipAfter;
  adSkip.disabled = true;
  adSkip.innerHTML = `O'tkazib yuborish · <span id="ad-timer">${secondsLeft}</span>`;

  clearInterval(adCountdownInterval);
  adCountdownInterval = setInterval(() => {
    secondsLeft -= 1;
    if (secondsLeft <= 0) {
      clearInterval(adCountdownInterval);
      adSkip.disabled = false;
      adSkip.innerHTML = "O'tkazib yuborish ⏭";
    } else {
      const t = document.getElementById('ad-timer');
      if (t) t.textContent = secondsLeft;
    }
  }, 1000);

  adSkip.onclick = () => {
    if (adSkip.disabled) return;
    clearInterval(adCountdownInterval);
    adBackdrop.classList.remove('open');
    adVideo.pause();
    onDone();
  };
}

function openPlayer(m, titleOverride){
  showAd(() => playVideoNow(m, titleOverride));
}

function playVideoNow(m, titleOverride){
  playerTitle.textContent = titleOverride || m.title;
  playerVideo.src = m.video;
  playerBackdrop.classList.add('open');
  playerVideo.play().catch(() => {});
  tg?.BackButton?.show();
}

function closePlayer(){
  playerVideo.pause();
  playerVideo.removeAttribute('src');
  playerVideo.load();
  playerBackdrop.classList.remove('open');
  tg?.BackButton?.hide();
}

document.getElementById('player-close').onclick = closePlayer;

tg?.BackButton?.onClick(() => {
  if (playerBackdrop.classList.contains('open')) {
    closePlayer();
  } else {
    closeSheet();
  }
});

function tryShowPeriodicAd(){
  const playerOpen = playerBackdrop.classList.contains('open');
  const sheetOpen = sheet.classList.contains('open');
  const adAlreadyOpen = adBackdrop.classList.contains('open');
  if (playerOpen || sheetOpen || adAlreadyOpen) return; // band bo'lsa o'tkazib yuboramiz

  if (adsgramController) {
    try {
      adsgramController.show().catch(() => {});
    } catch (e) {
      console.warn("Periodic Adsgram show failed:", e);
    }
  }
}

setInterval(tryShowPeriodicAd, PERIODIC_AD_INTERVAL_MS);
</script>
