<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kino Top</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0d12;
    --bg-elev:#17151d;
    --bg-elev-2:#1e1b25;
    --accent:#e8a33d;
    --accent-soft:#f0c37a;
    --velvet:#c1443d;
    --text:#f3efe6;
    --text-dim:#9a93a6;
    --stub-notch: var(--bg);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, #241f2b 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:calc(24px + var(--safe-bottom));
    overflow-x:hidden;
  }

  /* Film-strip perforation band */
  .filmstrip{
    height:14px;
    width:100%;
    background-image:
      repeating-linear-gradient(90deg, var(--bg-elev-2) 0 8px, transparent 8px 18px);
    background-color:#000;
    position:relative;
  }
  .filmstrip::before, .filmstrip::after{
    content:"";
    position:absolute;
    top:3px;
    height:8px;
    width:100%;
    background-image: repeating-linear-gradient(90deg, var(--bg) 0 5px, transparent 5px 15px);
  }

  header.hero{
    padding:22px 20px 18px;
    padding-top:calc(22px + var(--safe-top));
    position:relative;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    margin:0 0 4px;
  }
  h1.marquee{
    font-family:'Bebas Neue',sans-serif;
    font-size:44px;
    letter-spacing:.03em;
    margin:0;
    line-height:.95;
    background:linear-gradient(180deg, var(--accent-soft), var(--accent) 60%, #b9781f);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 2px 24px rgba(232,163,61,.18);
  }
  .sub{
    color:var(--text-dim);
    font-size:13.5px;
    margin-top:6px;
    max-width:32ch;
  }

  .search-wrap{
    margin:18px 20px 6px;
    position:relative;
  }
  .search-wrap input{
    width:100%;
    background:var(--bg-elev);
    border:1px solid #2a2632;
    color:var(--text);
    padding:13px 16px 13px 42px;
    border-radius:14px;
    font-size:15px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s ease;
  }
  .search-wrap input:focus{ border-color:var(--accent); }
  .search-wrap input::placeholder{ color:var(--text-dim); }
  .search-icon{
    position:absolute;
    left:15px; top:50%; transform:translateY(-50%);
    width:16px; height:16px;
    color:var(--text-dim);
  }

  .chips{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:14px 20px 4px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    padding:8px 15px;
    border-radius:999px;
    background:var(--bg-elev);
    border:1px solid #2a2632;
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .chip.active{
    background:var(--accent);
    color:#1a1305;
    border-color:var(--accent);
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    padding:16px 20px 10px;
  }

  /* Ticket stub card — the signature element */
  .ticket{
    position:relative;
    background:var(--bg-elev);
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    border:1px solid #2a2632;
    transition:transform .12s ease, border-color .12s ease;
  }
  .ticket:active{ transform:scale(.97); }
  .poster{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    display:block;
    background:linear-gradient(160deg,#242030,#171520);
  }
  .rating-badge{
    position:absolute;
    top:8px; right:8px;
    background:rgba(14,13,18,.78);
    backdrop-filter:blur(4px);
    color:var(--accent-soft);
    font-size:11.5px;
    font-weight:800;
    padding:3px 8px;
    border-radius:8px;
    display:flex;
    align-items:center;
    gap:3px;
    border:1px solid rgba(232,163,61,.35);
  }
  .stub-divider{
    position:relative;
    height:1px;
    border-top:1.5px dashed #34303f;
    margin:0 2px;
  }
  .stub-divider::before, .stub-divider::after{
    content:"";
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:16px; height:16px;
    background:var(--bg);
    border-radius:50%;
  }
  .stub-divider::before{ left:-10px; }
  .stub-divider::after{ right:-10px; }

  .ticket-body{ padding:10px 12px 12px; }
  .ticket-title{
    font-size:14px;
    font-weight:700;
    line-height:1.25;
    margin:0 0 4px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .ticket-meta{
    font-size:11.5px;
    color:var(--text-dim);
    display:flex;
    gap:6px;
    align-items:center;
  }
  .dot{ width:3px; height:3px; border-radius:50%; background:var(--text-dim); }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--text-dim);
    font-size:14px;
  }

  /* Detail sheet */
  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(5,4,7,.6);
    backdrop-filter:blur(2px);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
    z-index:40;
  }
  .sheet-backdrop.open{ opacity:1; pointer-events:auto; }

  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    max-height:88vh;
    background:var(--bg-elev);
    border-radius:22px 22px 0 0;
    transform:translateY(102%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
    z-index:41;
    overflow-y:auto;
    padding-bottom:calc(24px + var(--safe-bottom));
  }
  .sheet.open{ transform:translateY(0); }
  .sheet-handle{
    width:36px; height:4px;
    background:#3a3546;
    border-radius:99px;
    margin:10px auto 0;
  }
  .sheet-hero{
    position:relative;
    display:flex;
    gap:14px;
    padding:18px 20px 14px;
  }
  .sheet-poster{
    width:104px; aspect-ratio:2/3;
    border-radius:12px;
    object-fit:cover;
    flex:0 0 auto;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .sheet-info{ padding-top:2px; }
  .sheet-title{
    font-family:'Bebas Neue',sans-serif;
    font-size:26px;
    letter-spacing:.02em;
    line-height:1;
    margin:0 0 8px;
    color:var(--text);
  }
  .sheet-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .tag{
    font-size:11px; font-weight:700;
    padding:4px 9px;
    border-radius:7px;
    background:var(--bg-elev-2);
    color:var(--text-dim);
    border:1px solid #2a2632;
  }
  .sheet-rating{
    display:flex; align-items:center; gap:5px;
    color:var(--accent-soft); font-weight:800; font-size:14px;
  }
  .sheet-divider{ position:relative; height:1px; border-top:1.5px dashed #34303f; margin:2px 0 16px; }
  .sheet-divider::before, .sheet-divider::after{
    content:""; position:absolute; top:50%; transform:translateY(-50%);
    width:20px; height:20px; background:var(--bg); border-radius:50%;
  }
  .sheet-divider::before{ left:-10px; }
  .sheet-divider::after{ right:-10px; }
  .sheet-desc{
    padding:0 20px;
    font-size:14px;
    line-height:1.6;
    color:#d8d3e0;
  }
  .sheet-actions{
    padding:18px 20px 4px;
    display:flex;
    gap:10px;
  }
  .btn-watch{
    flex:1;
    background:linear-gradient(135deg, var(--accent-soft), var(--accent));
    color:#1a1305;
    border:none;
    padding:14px;
    border-radius:14px;
    font-weight:800;
    font-size:15px;
    font-family:inherit;
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
  }
  .btn-close{
    background:var(--bg-elev-2);
    color:var(--text-dim);
    border:1px solid #2a2632;
    padding:14px 18px;
    border-radius:14px;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="filmstrip"></div>

<header class="hero">
  <p class="eyebrow">Bugungi tanlov</p>
  <h1 class="marquee">KINO TOP</h1>
  <p class="sub">Eng yaxshi baholangan filmlar — bittasini tanlang va tomosha qilishni boshlang.</p>
</header>

<div class="search-wrap">
  <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  <input id="search" type="text" placeholder="Film qidirish...">
</div>

<div class="chips" id="chips"></div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none;">Hech narsa topilmadi 🎬</div>

<div class="filmstrip"></div>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-hero">
    <img class="sheet-poster" id="sheet-poster" src="" alt="">
    <div class="sheet-info">
      <h2 class="sheet-title" id="sheet-title"></h2>
      <div class="sheet-tags" id="sheet-tags"></div>
      <div class="sheet-rating" id="sheet-rating"></div>
    </div>
  </div>
  <div class="sheet-divider"></div>
  <p class="sheet-desc" id="sheet-desc"></p>
  <div class="sheet-actions">
    <button class="btn-watch" id="btn-watch">▶ Tomosha qilish</button>
    <button class="btn-close" id="btn-close">Yopish</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor?.('#0e0d12');
  tg.setBackgroundColor?.('#0e0d12');
}

const MOVIES = [
  { id:1, title:"Yulduzlar orasida", year:2014, genre:"Fantastika", rating:8.6, duration:"169 daq", desc:"Yer inqirozga yuz tutgan kelajakda, bir guruh astronavtlar insoniyatga yangi vatan topish umidida kosmosdagi qurtli teshik orqali sayohat qiladi.", poster:"https://picsum.photos/seed/interstellar/400/600" },
  { id:2, title:"Boshlanish", year:2010, genre:"Triller", rating:8.4, duration:"148 daq", desc:"Tush ichiga kirib, odamlarning ongidan g'oyalarni o'g'irlaydigan mutaxassis, bu safar aksincha — birovning ongiga g'oya joylashtirish vazifasini oladi.", poster:"https://picsum.photos/seed/inception/400/600" },
  { id:3, title:"Jasur yurak", year:1995, genre:"Drama", rating:8.3, duration:"178 daq", desc:"XIII asr Shotlandiyasida ozodlik uchun kurashgan jangchining haqiqiy voqealarga asoslangan tarixi.", poster:"https://picsum.photos/seed/braveheart/400/600" },
  { id:4, title:"Matritsa", year:1999, genre:"Fantastika", rating:8.7, duration:"136 daq", desc:"Kompyuter dasturchisi voqelik aslida mashinalar tomonidan yaratilgan simulyatsiya ekanini bilib qoladi.", poster:"https://picsum.photos/seed/matrix/400/600" },
  { id:5, title:"Qasoskorlar", year:2019, genre:"Jangari", rating:8.4, duration:"181 daq", desc:"Yer qahramonlari koinotni qutqarish uchun so'nggi va eng katta jangga tayyorlanmoqda.", poster:"https://picsum.photos/seed/avengers/400/600" },
  { id:6, title:"Kulgili kunlar", year:2021, genre:"Komediya", rating:7.5, duration:"104 daq", desc:"Bir oilaning ta'til paytida boshidan kechirgan kulgili va kutilmagan sarguzashtlari.", poster:"https://picsum.photos/seed/funnydays/400/600" },
  { id:7, title:"Zulmat qirg'og'ida", year:2018, genre:"Triller", rating:7.9, duration:"122 daq", desc:"Kichik shaharchada sodir bo'lgan sirli voqealarni tergovchi surishtiradi, ammo haqiqat undan ham qorong'iroq.", poster:"https://picsum.photos/seed/darkedge/400/600" },
  { id:8, title:"Yo'lbars yuragi", year:2016, genre:"Drama", rating:8.1, duration:"131 daq", desc:"Sport dunyosida barcha qiyinchiliklarga qaramay g'alabaga intilgan yosh sportchining hikoyasi.", poster:"https://picsum.photos/seed/tigerheart/400/600" },
  { id:9, title:"So'nggi chegara", year:2022, genre:"Jangari", rating:7.8, duration:"142 daq", desc:"Chegara qo'shinlari qo'mondoni o'z jamoasini xavfli missiyada omon saqlab qolishga urinadi.", poster:"https://picsum.photos/seed/lastfrontier/400/600" },
  { id:10, title:"Kulgi terapiyasi", year:2020, genre:"Komediya", rating:7.2, duration:"98 daq", desc:"Hayotidan charchagan komediyachi kichik shaharchaga borib, u yerda kutilmagan do'stlar topadi.", poster:"https://picsum.photos/seed/laughtherapy/400/600" },
  { id:11, title:"Chuqur suvlar", year:2017, genre:"Triller", rating:7.6, duration:"115 daq", desc:"Okeanograf o'z ekipaji bilan noma'lum chuqurlikdagi tajovuzkor mavjudot bilan yuzma-yuz keladi.", poster:"https://picsum.photos/seed/deepwaters/400/600" },
  { id:12, title:"Ikki dunyo oralig'i", year:2023, genre:"Fantastika", rating:8.0, duration:"152 daq", desc:"Ikki parallel dunyo o'rtasida qolib ketgan qiz, uyiga qaytish yo'lini izlaydi.", poster:"https://picsum.photos/seed/betweenworlds/400/600" }
];

const GENRES = ["Barchasi", "Drama", "Jangari", "Komediya", "Fantastika", "Triller"];
let activeGenre = "Barchasi";
let query = "";

const chipsEl = document.getElementById('chips');
GENRES.forEach(g => {
  const c = document.createElement('div');
  c.className = 'chip' + (g === activeGenre ? ' active' : '');
  c.textContent = g;
  c.onclick = () => {
    activeGenre = g;
    document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
    c.classList.add('active');
    render();
  };
  chipsEl.appendChild(c);
});

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase();
  render();
});

function render(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';
  const filtered = MOVIES.filter(m =>
    (activeGenre === "Barchasi" || m.genre === activeGenre) &&
    (query === "" || m.title.toLowerCase().includes(query))
  );
  empty.style.display = filtered.length ? 'none' : 'block';
  filtered.forEach(m => {
    const card = document.createElement('div');
    card.className = 'ticket';
    card.innerHTML = `
      <div style="position:relative;">
        <img class="poster" src="${m.poster}" alt="${m.title}" loading="lazy">
        <div class="rating-badge">★ ${m.rating}</div>
      </div>
      <div class="stub-divider"></div>
      <div class="ticket-body">
        <p class="ticket-title">${m.title}</p>
        <div class="ticket-meta"><span>${m.year}</span><span class="dot"></span><span>${m.genre}</span></div>
      </div>
    `;
    card.onclick = () => openSheet(m);
    grid.appendChild(card);
  });
}

const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');

function openSheet(m){
  document.getElementById('sheet-poster').src = m.poster;
  document.getElementById('sheet-title').textContent = m.title;
  document.getElementById('sheet-tags').innerHTML =
    `<span class="tag">${m.year}</span><span class="tag">${m.genre}</span><span class="tag">${m.duration}</span>`;
  document.getElementById('sheet-rating').innerHTML = `★ ${m.rating} / 10`;
  document.getElementById('sheet-desc').textContent = m.desc;
  document.getElementById('btn-watch').onclick = () => {
    tg?.showAlert ? tg.showAlert(`"${m.title}" filmi tez orada qo'shiladi 🎬`) : alert(`"${m.title}" filmi tez orada qo'shiladi 🎬`);
  };
  sheet.classList.add('open');
  backdrop.classList.add('open');
  tg?.BackButton?.show();
}

function closeSheet(){
  sheet.classList.remove('open');
  backdrop.classList.remove('open');
  tg?.BackButton?.hide();
}

document.getElementById('btn-close').onclick = closeSheet;
backdrop.onclick = closeSheet;
tg?.BackButton?.onClick(closeSheet);

render();
</script>
</body>
</html>
